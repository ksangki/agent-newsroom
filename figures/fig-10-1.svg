<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="방문 경로와 인용 경로" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>방문 경로와 인용 경로</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1b2629"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c24e30"/></marker></defs><rect width="1000" height="540" fill="#f7f5f1"/><text fill="#1b2629" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="62.0" y="142.0">방문 경로</tspan></text><text fill="#1b2629" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="62.0" y="402.0">인용 경로</tspan></text><rect x="130" y="100" width="200" height="84" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="230.0" y="136.9" fill="#1b2629" font-size="18" font-weight="700" text-anchor="middle">노출</text><text x="230.0" y="160.8" fill="#5f6d70" font-size="14.5" font-weight="400" text-anchor="middle">검색 결과·피드에 뜬다</text><rect x="380" y="100" width="200" height="84" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="480.0" y="136.9" fill="#1b2629" font-size="18" font-weight="700" text-anchor="middle">클릭</text><text x="480.0" y="160.8" fill="#5f6d70" font-size="14.5" font-weight="400" text-anchor="middle">누군가 글을 연다</text><path d="M332,142.0 L378,142.0" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><rect x="130" y="360" width="200" height="84" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="230.0" y="396.9" fill="#1b2629" font-size="18" font-weight="700" text-anchor="middle">수집</text><text x="230.0" y="420.8" fill="#5f6d70" font-size="14.5" font-weight="400" text-anchor="middle">기계 독자가 가져간다</text><rect x="380" y="360" width="200" he