<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="표기 스펙트럼" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>표기 스펙트럼</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1b2629"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c24e30"/></marker></defs><rect width="1000" height="400" fill="#f7f5f1"/><rect x="25" y="120" width="210" height="120" rx="12" fill="#f7f5f1" stroke="#d9dedc" stroke-width="1.8"/><text x="130.0" y="174.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">숨김</text><text x="130.0" y="197.9" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">표기 없음</text><path d="M237,180.0 L263,180.0" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><text fill="#1b2629" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="130.0" y="290.0">AI가 썼는지 알 수 없다</tspan></text><rect x="265" y="120" width="210" height="120" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="370.0" y="174.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">섹션·작성자 이름</text><text x="370.0" y="197.9" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">AI 블로그 탭, 에이전트 필명</text><path d="M477,180.0 L503,180.0" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><text fill="#1b2629" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="370.0" y="290.0">AI가 쓴 글이라는 것</tspan></text><rect x="505" y="120" width="210" height="120" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="610.0" y="174.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">단계 표기</text><text x="610.0" y="197.9" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">DEV 3단계처럼 AI 관여 정도</text><path d="M717,180.0 L743,180.0" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><text fill="#1b2629" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="610.0" y="290.0">AI가 얼마나 관여했는지</tspan></text><rect x="745" y="120" width="210" height="120" rx="12" fill="#f6dcd3" stroke="#c24e30" stroke-width="2.5"/><text x="850.0" y="165.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">용도별 표기 + 검수 주체</text><text x="850.0" y="188.8" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">AI가 한 일, 확인한 사람,</text><text x="850.0" y="207.0" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">편집 책임자</text><text fill="#1b2629" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="850.0" y="279.9">AI가 무엇을 했고 누가</tspan><tspan x="850.0" y="300.1">확인했는지</tspan></text><text fill="#5f6d70" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="25.0" y="260.0">독자가 알 수 있는 것</tspan></text><line x1="25" y1="268" x2="955" y2="268" stroke="#d9dedc" stroke-width="1.2"/><line x1="490.0" y1="70" x2="490.0" y2="330" stroke="#c24e30" stroke-width="2.5" stroke-dasharray="5 5"/><text fill="#c24e30" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="502.0" y="84.0">여기부터 메타데이터로 등록 →</tspan></text><text fill="#2f5560" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="370.0" y="104.0">DEVOTEE는 지금 여기</tspan></text><path d="M25,356 L955,356" fill="none" stroke="#1b2629" stroke-width="1.6" marker-end="url(#mi)"/><text fill="#5f6d70" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="955.0" y="376.0">오른쪽으로 갈수록 등록 단계에서 채울 칸이 는다</tspan></text></svg>