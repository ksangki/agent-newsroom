<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="여섯 방법의 가설 지도" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>여섯 방법의 가설 지도</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1b2629"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c24e30"/></marker></defs><rect width="1000" height="620" fill="#f7f5f1"/><line x1="130" y1="520" x2="940" y2="520" stroke="#1b2629" stroke-width="2"/><line x1="130" y1="520" x2="130" y2="50" stroke="#1b2629" stroke-width="2"/><path d="M130,520 L950,520" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><path d="M130,520 L130,40" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><text fill="#1b2629" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="535.0" y="560.0">기계 대체 난이도 →</tspan></text><text fill="#5f6d70" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="140.0" y="542.0">쉽다</tspan></text><text fill="#5f6d70" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="940.0" y="542.0">어렵다</tspan></text><text x="70" y="285.0" fill="#1b2629" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90 70 285.0)">사람 관계 강도 →</text><text fill="#5f6d70" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="120.0" y="506.0">약하다</tspan></text><text fill="#5f6d70" font-size="13" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="120.0" y="60.0">강하다</tspan></text><circle cx="275.8" cy="416.6" r="12" fill="#dfe9eb" stroke="#2f5560" stroke-width="2"/><text fill="#1b2629" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="297.8" y="416.6">큐레이션</tspan></text><circle cx="842.8" cy="322.6" r="34" fill="#dfe9eb" stroke="#2f5560" stroke-width="2"/><text fill="#1b2629" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="886.8" y="322.6">원재료</tspan></text><circle cx="632.2" cy="106.4" r="26" fill="#dfe9eb" stroke="#2f5560" stroke-width="2"/><text fill="#1b2629" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="668.2" y="106.4">커뮤니티</tspan></text><circle cx="470.2" cy="191.0" r="20" fill="#dfe9eb" stroke="#2f5560" stroke-width="2"/><text fill="#1b2629" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="500.2" y="191.0">직접 관계·뉴스레터</tspan></text><circle cx="389.2" cy="303.8" r="20" fill="#dfe9eb" stroke="#2f5560" stroke-width="2"/><text fill="#1b2629" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="419.2" y="303.8">대화형 문서</tspan></text><circle cx="729.4" cy="426.0" r="30" fill="#dfe9eb" stroke="#2f5560" stroke-width="2"/><text fill="#1b2629" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="769.4" y="426.0">실행되는 글</tspan></text><text fill="#c24e30" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="middle"><tspan x="940.0" y="54.0">위치는 잰 값이 아니라 이 책의 가정</tspan></text><text fill="#5f6d70" font-size="14" font-weight="400" text-anchor="end" dominant-baseline="middle"><tspan x="690.0" y="584.0">점 크기 = 매주 굴리는 데 드는 사람의 시간</tspan></text><circle cx="730" cy="584" r="8" fill="#dfe9eb" stroke="#2f5560" stroke-width="1.5"/><circle cx="790" cy="584" r="14" fill="#dfe9eb" stroke="#2f5560" stroke-width="1.5"/><circle cx="850" cy="584" r="22" fill="#dfe9eb" stroke="#2f5560" stroke-width="1.5"/></svg>