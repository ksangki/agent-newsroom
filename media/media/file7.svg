<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="글의 수명 주기" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>글의 수명 주기</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1b2629"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c24e30"/></marker></defs><rect width="1000" height="540" fill="#f7f5f1"/><rect x="30" y="190" width="190" height="110" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="125.0" y="230.4" fill="#1b2629" font-size="18" font-weight="700" text-anchor="middle">등록</text><text x="125.0" y="254.3" fill="#5f6d70" font-size="14.5" font-weight="400" text-anchor="middle">다룬 질문·버전·검토</text><text x="125.0" y="273.2" fill="#5f6d70" font-size="14.5" font-weight="400" text-anchor="middle">기한·표기 칸</text><rect x="270" y="190" width="160" height="110" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="350.0" y="251.3" fill="#1b2629" font-size="18" font-weight="700" text-anchor="middle">발행</text><rect x="480" y="190" width="200" height="110" rx="12" fill="#f6dcd3" stroke="#c24e30" stroke-width="2.5"/><text x="580.0" y="230.4" fill="#1b2629" font-size="18" font-weight="700" text-anchor="middle">점검</text><text x="580.0" y="254.3" fill="#5f6d70" font-size="14.5" font-weight="400" text-anchor="middle">사건 기반 재심사 + 바닥</text><text x="580.0" y="273.2" fill="#5f6d70" font-size="14.5" font-weight="400" text-anchor="middle">주기</text><path d="M224,245 L266,245" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><path d="M434,245 L476,245" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><rect x="760" y="84" width="200" height="64" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="860.0" y="110.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">수정</text><text x="860.0" y="133.9" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">고친 내역을 남긴다</text><rect x="760" y="214" width="200" height="64" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="860.0" y="240.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">통합</text><text x="860.0" y="263.9" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">남길 글로 주소를 넘긴다</text><rect x="760" y="344" width="200" height="64" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="860.0" y="370.9" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">내림</text><text x="860.0" y="394.0" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">목록과 색인에서 뺀다</text><path d="M684,232 L756,120" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><path d="M684,246 L756,246" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><path d="M684,260 L756,372" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><line x1="860" y1="84" x2="860" y2="44" stroke="#1b2629" stroke-width="2"/><line x1="960" y1="246" x2="985" y2="246" stroke="#1b2629" stroke-width="2"/><line x1="985" y1="246" x2="985" y2="44" stroke="#1b2629" stroke-width="2"/><path d="M985,44 L350,44 L350,186" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><text fill="#5f6d70" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" y="30.0">수정·통합은 다시 발행 상태로</tspan></text><rect x="760" y="452" width="200" height="70" rx="12" fill="#dfe9eb" stroke="#d9dedc" stroke-width="1.8"/><text x="860.0" y="481.9" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">묘비</text><text x="860.0" y="505.0" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">주소·처분 사유·이력 보존</text><path d="M860,412 L860,448" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><line x1="580" y1="304" x2="580" y2="330" stroke="#c24e30" stroke-width="1.5" stroke-dasharray="5 5"/><text x="490.0" y="344.7" fill="#c24e30" font-size="14" font-weight="700" text-anchor="start">재심사 사건</text><text x="490.0" y="365.6" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="start">· 원문이 정정되거나 내려갔을 때</text><text x="490.0" y="386.5" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="start">· 다룬 도구·서비스의 버전이 바뀌었을 때</text><text x="490.0" y="407.4" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="start">· 같은 질문에 답하는 새 글이 등록됐을 때</text><text x="490.0" y="428.3" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="start">· 독자가 오류를 알려 왔을 때</text></svg>