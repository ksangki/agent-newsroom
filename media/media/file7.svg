<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="원자 사실 검증 흐름" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>원자 사실 검증 흐름</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1b2629"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c24e30"/></marker></defs><rect width="1000" height="380" fill="#f7f5f1"/><rect x="24" y="170" width="168" height="104" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="108.0" y="207.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">쪼개기</text><text x="108.0" y="230.8" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">수치·날짜·고유명 ·</text><text x="108.0" y="249.0" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">인용·링크</text><path d="M194,222.0 L214,222.0" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><rect x="216" y="170" width="168" height="104" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="300.0" y="207.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">근거 검색</text><text x="300.0" y="230.8" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">링크가 1순위, 없으면</text><text x="300.0" y="249.0" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">검색</text><path d="M386,222.0 L406,222.0" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><rect x="408" y="170" width="168" height="104" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="492.0" y="216.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">대조</text><text x="492.0" y="239.9" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">주장과 출처를 나란히</text><path d="M578,222.0 L598,222.0" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><rect x="600" y="170" width="168" height="104" rx="12" fill="#f6dcd3" stroke="#c24e30" stroke-width="2.5"/><text x="684.0" y="216.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">판정</text><text x="684.0" y="239.9" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">정해 둔 값 중 하나</text><path d="M770,222.0 L790,222.0" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><rect x="792" y="170" width="168" height="104" rx="12" fill="#dfe9eb" stroke="#d9dedc" stroke-width="1.8"/><text x="876.0" y="207.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">사람 표본 확인</text><text x="876.0" y="230.8" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">판정의 일부를 다시</text><text x="876.0" y="249.0" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">본다</text><rect x="24" y="34" width="168" height="60" rx="12" fill="#f7f5f1" stroke="#5f6d70" stroke-width="1.8" stroke-dasharray="6 5"/><text fill="#5f6d70" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="108.0" y="64.0">작성 단계</tspan></text><path d="M684.0,166 L684.0,64 L196,64" fill="none" stroke="#c24e30" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#mc)"/><text fill="#c24e30" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="438.0" y="46.0">출처와 다름 · 근거를 찾지 못함이면 되돌린다</tspan></text><text fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="684.0" y="304.0">확인됨 / 출처와 다름 /</tspan></text><text fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="684.0" y="324.0">근거를 찾지 못함 / 시점이 지남</tspan></text><text fill="#5f6d70" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="684.0" y="350.0">판정 값 예시</tspan></text></svg>