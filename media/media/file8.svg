<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="두 독자의 경로" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>두 독자의 경로</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1b2629"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c24e30"/></marker></defs><rect width="1000" height="380" fill="#f7f5f1"/><text fill="#1b2629" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="40.0" y="92.0">첫 번째 독자</tspan></text><text fill="#5f6d70" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="40.0" y="118.0">사람</tspan></text><rect x="200" y="62" width="160" height="84" rx="12" fill="#dfe9eb" stroke="#d9dedc" stroke-width="1.8"/><text x="280.0" y="98.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">검색</text><text x="280.0" y="121.9" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">제목을 본다</text><path d="M362,104.0 L394,104.0" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><rect x="396" y="62" width="160" height="84" rx="12" fill="#dfe9eb" stroke="#d9dedc" stroke-width="1.8"/><text x="476.0" y="98.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">클릭</text><text x="476.0" y="121.9" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">글을 연다</text><path d="M558,104.0 L590,104.0" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><rect x="592" y="62" width="160" height="84" rx="12" fill="#dfe9eb" stroke="#d9dedc" stroke-width="1.8"/><text x="672.0" y="98.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">읽기</text><text x="672.0" y="121.9" fill="#5f6d70" font-size="14" font-weight="400" text-anc