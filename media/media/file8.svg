<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="문체 게이트의 세 층과 외부 전송 경계선" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>문체 게이트의 세 층과 외부 전송 경계선</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1b2629"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c24e30"/></marker></defs><rect width="1000" height="440" fill="#f7f5f1"/><rect x="30" y="180" width="180" height="84" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="120.0" y="216.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">쓰는 모델</text><text x="120.0" y="239.9" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">초안을 쓴다</text><text fill="#1b2629" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="270.0" y="40.0">공개될 글</tspan></text><rect x="270" y="64" width="200" height="90" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="370.0" y="103.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">문형 규칙</text><text x="370.0" y="126.9" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">정해 둔 문형을 센다</text><rect x="520" y="64" width="210" height="90" rx="12" fill="#f6dcd3" stroke="#c24e30" stroke-width="2.5"/><text x="625.0" y="94.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">판정 모델</text><text x="625.0" y="117.8" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">외부 서비스 · 선택지를</text><text x="625.0" y="136.1" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">고른다</text><rect x="780" y="64" width="190" height="90" rx="12" fill="#dfe9eb" stroke="#d9dedc" stroke-width="1.8"/><text x="875.0" y="103.8" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">사람 표본 검증</text><text x="875.0" y="126.9" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">두 판정이 맞는지 본다</text><path d="M212,206 L266,120" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><path d="M474,109 L516,109" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><path d="M734,109 L776,109" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><line x1="250" y1="222" x2="980" y2="222" stroke="#c24e30" stroke-width="2.5" stroke-dasharray="5 5"/><text fill="#c24e30" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="middle"><tspan x="980.0" y="206.0">외부 전송 경계선 — 위쪽 글만 판정 모델까지 나간다</tspan></text><text fill="#1b2629" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="270.0" y="270.0">사내 문서</tspan></text><rect x="270" y="294" width="200" height="90" rx="12" fill="#fffefb" stroke="#d9dedc" stroke-width="1.8"/><text x="370.0" y="333.9" fill="#1b2629" font-size="17" font-weight="700" text-anchor="middle">문형 규칙</text><text x="370.0" y="357.0" fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle">정해 둔 문형을 센다</text><rect x="520" y="294" width="210" height="90" rx="12" fill="#f7f5f1" stroke="#5f6d70" stroke-width="1.8" stroke-dasharray="6 5"/><text fill="#5f6d70" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="625.0" y="329.6">판정 모델</tspan></text><text fill="#5f6d70" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="625.0" y="351.8">보내지 않는다</tspan></text><path d="M212,240 L266,330" fill="none" stroke="#1b2629" stroke-width="2" marker-end="url(#mi)"/><text fill="#5f6d70" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="760.0" y="328.9">경계선 안에서 문형 규칙만</tspan><tspan x="760.0" y="349.1">적용</tspan></text></svg>